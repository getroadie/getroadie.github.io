<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadie | Alberta Learner's Test Prep (Class 7)</title>
<meta name="description" content="Free lessons, games and unlimited practice tests for the Alberta Class 7 learner's knowledge test, built from the official 2026 Alberta Driver's Guide.">
<meta property="og:title" content="Roadie: Alberta learner's test prep">
<meta property="og:description" content="Lessons, games and unlimited practice tests for the Alberta Class 7 learner's test, built from the official 2026 Driver's Guide.">
<meta name="theme-color" content="#12305b">
<!--ICONS-->
<style>
:root{
  --hh:84px;
  --navy:#12305b;--navy2:#1d4f91;--navy3:#2c64b0;--sky:#e9f0fa;--amber:#f5b301;--amber2:#fff6dc;
  --ink:#16202e;--ink2:#3b4758;--mut:#647185;--line:#e3e8ef;--bg:#f4f6fa;--card:#fff;
  --good:#1e7b45;--goodbg:#e6f4ec;--bad:#b42318;--badbg:#fdecea;
  --r:14px;--sh:0 1px 2px rgba(16,32,60,.06),0 4px 16px rgba(16,32,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--navy2)}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{line-height:1.2;letter-spacing:-.01em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header / nav */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);background:none;border:0;padding:0}
.brand svg{height:62px;width:auto;display:block;filter:drop-shadow(0 2px 4px rgba(16,32,60,.15))}
.brand b{font-size:17px;font-weight:750;display:block;line-height:1.1;text-align:left}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-align:left}
.xpchip{display:inline-flex;align-items:center;gap:6px;background:var(--amber2);color:#7a5600;border:1px solid #f1d98f;border-radius:30px;padding:4px 11px;font-size:13px;font-weight:700;margin-left:6px}
.xpchip svg.i{width:15px;height:15px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:8px 12px;border-radius:9px;color:var(--ink2);font-weight:600;font-size:14.5px}
.nav button:hover{background:var(--sky);color:var(--navy)}
.nav button.on{background:var(--navy);color:#fff}
.nav button svg.i{width:18px;height:18px}
.nav button,.xpchip{white-space:nowrap}
@media (max-width:1320px){.brand small{display:none}.nav button{padding:8px 9px}}
@media (max-width:1120px){.nav button svg.i{display:none}.xpchip{display:none}}
.bnav{display:none}
main{max-width:1200px;margin:0 auto;padding:22px 18px 30px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh);margin-bottom:18px}
.card h3{margin:0 0 10px;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:11px;padding:11px 19px;font-weight:650;font-size:15.5px;transition:transform .08s,background .15s}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(1px)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.amber:hover{background:#ffc226}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #c9d5e6}
.btn.ghost:hover{border-color:var(--navy2);background:var(--sky)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn svg.i{width:19px;height:19px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:30px;font-size:13.5px;font-weight:650}
.pill svg.i{width:15px;height:15px;stroke-width:2.6}
.pill.ok{background:var(--goodbg);color:var(--good)}.pill.no{background:var(--badbg);color:var(--bad)}.pill.neu{background:var(--sky);color:var(--navy2)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.linkish{background:none;border:0;color:var(--navy2);font-weight:600;padding:0;font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.linkish:hover{text-decoration:underline}
.linkish svg.i{width:16px;height:16px}
.back{margin-bottom:14px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#0e2749 0%,#163a6c 55%,#1d4f91 100%);color:#fff;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;margin-bottom:20px;box-shadow:0 10px 30px rgba(18,48,91,.25)}
.hero .tx{padding:34px 36px 38px}
.heroplate{margin:0 0 18px}
.heroplate svg{width:220px;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:30px;font-size:13px;font-weight:600;color:#dfe9f7}
.eyebrow svg.i{width:16px;height:16px}
.hero h1{font-size:40px;margin:14px 0 10px;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:#d2deef;font-size:17px;margin:0 0 22px;max-width:520px}
.hero .art{align-self:stretch;min-height:280px}
.hero .art svg{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:20px}
.stats div{padding:16px 18px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:26px;color:var(--navy);font-weight:800;letter-spacing:-.02em}
.stats span{font-size:13.5px;color:var(--mut)}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ic,.icbox{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sky);color:var(--navy2);flex:none}
.feat .ic.am,.icbox.am{background:var(--amber2);color:#9a6b00}
.feat h4{margin:2px 0 4px;font-size:16px}
.feat p{margin:0;color:var(--ink2);font-size:14.5px}
.ready{display:flex;gap:20px;align-items:center}
/* mascot + joke */
.mo{display:flex;gap:16px;align-items:center}
.mo svg.moose{width:92px;height:auto;flex:none}
.bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15.5px;color:var(--ink)}
.bubble:before{content:"";position:absolute;left:-9px;top:24px;width:16px;height:16px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.bubble .who{display:block;font-size:12px;font-weight:700;color:#9a6b00;letter-spacing:.04em;margin-bottom:2px}
/* guide reader */
.study{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:calc(var(--hh) + 14px);max-height:calc(100vh - var(--hh) - 30px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.search{position:relative;margin-bottom:8px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);width:18px;height:18px}
.search input{width:100%;padding:11px 12px 11px 38px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--bg)}
.search input:focus{outline:none;border-color:var(--navy3);background:#fff}
.toc details{border-radius:10px;margin-bottom:2px}
.toc details[open]{background:#f8fafd}
.toc summary{display:flex;align-items:center;gap:10px;padding:8px;font-weight:650;font-size:14.5px;cursor:pointer;list-style:none;border-radius:10px}
.toc summary:hover{background:var(--sky)}
.toc summary::-webkit-details-marker{display:none}
.toc .num{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.toc .num.z{background:var(--amber);color:var(--navy)}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px 5px 44px;font-size:14px;color:var(--ink2);text-decoration:none;border-radius:8px}
.toc a i{font-style:normal;color:var(--mut);font-size:12.5px;flex:none}
.toc a:hover{background:var(--sky);color:var(--navy)}
.toc a.on{background:var(--navy);color:#fff;font-weight:600}
.toc a.on i{color:#cfdcf0}
.results .r{padding:10px 8px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink2)}
.results .r:hover{background:var(--sky)}
.results .r b{display:block;color:var(--navy2);font-size:12.5px;margin-bottom:2px}
.viewer{max-width:860px}
.vbar{position:sticky;top:var(--hh);z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:rgba(244,246,250,.95);backdrop-filter:blur(6px);padding:8px 0 10px}
.vbar select{flex:1;min-width:0;max-width:440px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
.pv{position:relative;background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(16,32,60,.08),0 10px 30px rgba(16,32,60,.10);overflow:hidden;aspect-ratio:387/612;touch-action:pan-y pinch-zoom}
.pv img{display:block;width:100%;height:100%}
.pv .hl{position:absolute;background:rgba(255,212,0,.5);border-radius:2px;mix-blend-mode:multiply;pointer-events:none}
.pv .hl.q{background:rgba(255,196,0,.55);box-shadow:0 0 0 1px rgba(255,170,0,.4)}
.vfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:14px}
.menu-btn{display:none}
/* learn */
.lvl{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lvl .bar2{flex:1;min-width:200px}
.bar2 .t{height:12px;background:#e8edf4;border-radius:12px;overflow:hidden}
.bar2 .t i{display:block;height:100%;background:linear-gradient(90deg,#f5b301,#ffcf3d);border-radius:12px}
.bar2 .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:5px;font-weight:600}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:border-color .12s,transform .12s;position:relative}
.mod:hover{border-color:var(--navy3);transform:translateY(-2px)}
.mod .hd{display:flex;gap:12px;align-items:center}
.mod .cn{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.05em}
.mod b{display:block;font-size:16px;line-height:1.3}
.dots{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);font-weight:600}
.dots i{width:22px;height:6px;border-radius:6px;background:#e3e8ef}
.dots i.on{background:var(--good)}
.badge{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe07a,#f5b301 60%,#c98d00);display:grid;place-items:center;color:var(--navy);box-shadow:0 2px 6px rgba(201,141,0,.4)}
.badge svg.i{width:18px;height:18px;stroke-width:2.6}
.mban{border-radius:18px;background:linear-gradient(135deg,#0e2749,#1d4f91);color:#fff;padding:24px 26px;display:flex;gap:18px;align-items:center;margin-bottom:18px;box-shadow:0 8px 24px rgba(18,48,91,.2)}
.mban .ic{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:var(--amber);flex:none}
.mban .ic svg.i{width:34px;height:34px}
.mban .cn{font-size:13px;color:#bcd0ea;font-weight:700;letter-spacing:.05em}
.mban h2{margin:2px 0 4px;font-size:27px}
.mban p{margin:0;color:#d2deef}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.step .no{width:40px;height:40px;border-radius:50%;background:var(--sky);color:var(--navy2);display:grid;place-items:center;font-weight:800}
.step.done .no{background:var(--good);color:#fff}
.step h4{margin:0 0 2px;font-size:17px}
.step p{margin:0;color:var(--ink2);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--sky);color:var(--navy2);border:0;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600}
.chip:hover{background:#d6e3f5}
.vids{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.vid{width:210px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0}
.vid .th{position:relative;aspect-ratio:16/9;background:#0e2749 center/cover no-repeat;display:grid;place-items:center}
.vid .th span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.vid .th span svg.i{width:20px;height:20px;fill:#fff;stroke:none}
.vid div.t{padding:8px 10px;font-size:13px;font-weight:600;line-height:1.3}
.vid div.t small{display:block;color:var(--mut);font-weight:500}
/* flashcards */
.fc{perspective:1200px;max-width:620px;margin:0 auto 16px;cursor:pointer}
.fc .inner{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 28px rgba(16,32,60,.12)}
.fc .front{background:#fff;border:1px solid var(--line)}
.fc .back{background:linear-gradient(135deg,#0e2749,#1d4f91);color:#fff;transform:rotateY(180deg)}
.fc .front .lab,.fc .back .lab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);margin-bottom:10px}
.fc .back .lab{color:#bcd0ea}
.fc .front .q{font-size:20px;font-weight:700;line-height:1.35}
.fc .back .a{font-size:22px;font-weight:800;color:var(--amber);line-height:1.3}
.fc .back .qt{font-size:14px;color:#d2deef;margin-top:14px;font-style:italic;max-width:520px}
.fc img{max-width:150px;max-height:120px;margin-bottom:12px;background:#fff;border-radius:10px;padding:8px}
.tap{font-size:13px;color:var(--mut);margin-top:14px}
/* speed round */
.sr{max-width:680px;margin:0 auto}
.srtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.srtop .big{font-size:28px;font-weight:800;color:var(--navy)}
.srtop .tm{font-size:28px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.srtop .tm.low{color:var(--bad)}
.combo{display:inline-block;background:var(--amber);color:var(--navy);font-weight:800;border-radius:20px;padding:2px 10px;font-size:14px;margin-left:8px}
.stmt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(16,32,60,.10);text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center}
.stmt .q{font-size:18.5px;font-weight:700;margin-bottom:14px}
.stmt .a{display:inline-block;align-self:center;background:var(--sky);color:var(--navy);font-weight:750;font-size:18px;padding:10px 18px;border-radius:12px}
.stmt.good{animation:pop .35s}
.stmt.badd{animation:shake .35s}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tf button{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;display:flex;gap:8px;justify-content:center;align-items:center}
.tf .y{background:var(--good);color:#fff}.tf .n{background:var(--bad);color:#fff}
.tf svg.i{stroke-width:3}
.srmsg{min-height:26px;text-align:center;font-size:14.5px;margin-top:10px;color:var(--ink2)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* sign match */
.smatch{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;max-width:820px;margin:0 auto}
.smatch .col{display:flex;flex-direction:column;gap:10px}
.smatch button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-weight:600;font-size:15px;min-height:74px;display:flex;align-items:center;gap:10px;transition:border-color .12s,background .12s}
.smatch button img{max-height:56px;max-width:110px;margin:0 auto}
.smatch button.sel{border-color:var(--navy2);background:var(--sky)}
.smatch button.ok{border-color:var(--good);background:var(--goodbg);opacity:.6;cursor:default}
.smatch button.err{animation:shake .35s;border-color:var(--bad)}
/* quiz */
.qwrap{max-width:780px;margin:0 auto}
.qcard{padding:0;overflow:hidden}
.qtop{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0;font-size:14px;color:var(--mut);font-weight:600}
.qtop .tag{display:inline-flex;align-items:center;gap:7px;color:var(--navy2)}
.bar{height:6px;background:#e6ebf2;border-radius:6px;overflow:hidden;margin:12px 24px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy3));border-radius:6px;transition:width .25s}
.qbody{padding:20px 24px 8px}
.qtext{font-size:21px;font-weight:700;margin:0 0 18px;line-height:1.35}
.qimg{display:flex;justify-content:center;margin:0 0 18px}
.qimg div{background:#f3f5f9;border:1px solid var(--line);border-radius:14px;padding:16px 26px}
.qimg img{display:block;max-width:220px;max-height:190px}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:16.5px;transition:border-color .12s,background .12s}
.choice .k{width:30px;height:30px;border-radius:9px;background:var(--sky);color:var(--navy2);display:grid;place-items:center;font-weight:750;font-size:14px;flex:none}
.choice:hover{border-color:var(--navy3)}
.choice.sel{border-color:var(--navy2);background:var(--sky)}
.choice.sel .k{background:var(--navy2);color:#fff}
.choice.right{border-color:var(--good);background:var(--goodbg)}
.choice.right .k{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choice.wrong .k{background:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.hint{display:flex;gap:12px;background:var(--amber2);border:1px solid #f3dc9b;color:#5a3d00;border-radius:12px;padding:12px 16px;margin:4px 0 14px;font-size:15.5px}
.hint svg.i{color:#b07a00;margin-top:2px}
.fb{border-radius:12px;padding:14px 16px;margin:4px 0 14px;font-size:15.5px}
.fb.ok{background:var(--goodbg);border:1px solid #bfe3cc}
.fb.no{background:var(--badbg);border:1px solid #f4c7c2}
.fb .h{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:4px}
.fb.ok .h{color:var(--good)}.fb.no .h{color:var(--bad)}
.fb .h svg.i{stroke-width:2.6;width:18px;height:18px}
.quote{font-size:14.5px;color:var(--ink2);border-left:3px solid var(--amber);padding:2px 0 2px 12px;margin:8px 0}
.quote b{font-style:normal;color:var(--mut);font-size:12.5px;display:block;text-transform:uppercase;letter-spacing:.03em}
.qfoot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 24px 18px;border-top:1px solid var(--line);background:#fafbfd}
.hbtn{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1.5px solid #ecd28a;color:#7a5600;border-radius:11px;padding:9px 14px;font-weight:650}
.hbtn:disabled{border-color:var(--line);color:var(--mut);cursor:default}
.hbtn svg.ring{width:24px;height:24px;transform:rotate(-90deg)}
.kbd{font-size:12.5px;color:var(--mut)}
/* results */
.res{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.ringwrap{position:relative}
.ringwrap svg{transform:rotate(-90deg)}

<script>
"use strict";
const PASS = 25, TEST_LEN = 30, QUIZ_LEN = 10, CHECK_PASS = 8, HINT_DELAY = 30, SR_TIME = 60;
const LS = "abLearnerPractice.v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "");
const printed = p => p - 2;  // PDF page -> page number printed on the guide page
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- icons ----------
const P = {

  c8: '<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l3.5-7h5l3.5 7M9.5 9L12 16h-6M13 6h3"/>',

const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ""}</svg>`;

// ---------- Mo the Moose (mascot) and jokes ----------
/*__DOUG__*/
const JOKES_FALLBACK = [
  "Why does the yield sign get invited to every party? It always lets everyone else go first.",
  "What did the roundabout say to the nervous driver? \"Don't worry, you'll come around.\"",
  "Why don't geese need a learner's licence? They've been merging in formation for years.",
  "I asked the stop sign for life advice. It said, \"Have you tried brakes?\"",
  "Why was the speed bump so popular? It really knew how to slow things down.",
  "Why did I fail parallel parking in the moose car? The antlers kept tapping the car behind me.",
  "Why did the traffic light turn red? You would too if you had to change in the middle of the street.",
  "What's a car's favourite meal? Brake-fast.",
  "Why did the learner bring a ladder to the lesson? They heard they'd be driving on the high-way.",
  "Why are snowplows great at parties? They really know how to break the ice.",
  "What do you call a dinosaur with a learner's licence? A Tyrannosaurus Wrecks. Don't be a T. Wrecks.",
  "Why did the bicycle tip over at the intersection? It was two-tired.",
  "My GPS keeps saying \"make a U-turn when possible.\" I think my GPS has given up on me.",
  "What do you call a car that tells bad jokes? A pun-tiac.",
  "Turn signals: the original way to tell people your plans without a group chat.",
  "Why do tires always look stressed? They're under constant pressure.",
  "What does a tired car do? Takes a car-nap. (Drowsy driving is no joke, though.)",
  "Mirrors: because your car has more blind spots than your little brother has excuses.",
  "Why did the cow cross the road? To get to the udder side.",
  "I told my supervising driver a joke about a pothole. It went right over their head... then right under the car."
];
const JOKES = (typeof JOKE_BANK !== "undefined" && JOKE_BANK.length >= 50) ? JOKE_BANK : JOKES_FALLBACK;
// every joke shown is the next unseen one from a per-student shuffled deck (persists across visits)
function nextJoke() {
  const n = JOKES.length;
  if (!ST.jk || ST.jk.n !== n || ST.jk.i >= n) ST.jk = { n, order: shuffle([...Array(n).keys()]), i: 0 };
  const j = JOKES[ST.jk.order[ST.jk.i++]]; save(); return j;
}
const moSays = (txt, who = "BIG DOUG SAYS", mood = "chill") => `<div class="mo">${bigDoug(mood, "moose")}<div class="bubble"><span class="who">${who}</span>${esc(txt)}</div></div>`;

// ---------- data indexes ----------
const SECTIONS = [], SEC = {}, CH = {};
HB.chapters.forEach(c => { CH[c.n] = c; c.sections.forEach(s => { s.ch = c.n; SECTIONS.push(s); SEC[s.id] = s; }); });
const QBYCH = {}; QS.forEach(q => (QBYCH[q.ch] = QBYCH[q.ch] || []).push(q));
const PAGE_LIST = Object.keys(PAGES).map(Number).sort((a, b) => a - b);
const secForPage = p => { let best = null; SECTIONS.forEach(s => { if (s.page <= p && (!best || s.page >= best.page)) best = s; }); return best; };
const chForPage = p => { const c = HB.chapters.find(c => p >= c.start && p <= c.end); return c ? c.n : 0; };
const PNORM = {}, PTEXT = {};
PAGE_LIST.forEach(p => { const ws = WORDS.pages[p] || []; PNORM[p] = ws.map(w => norm(w[0])); PTEXT[p] = ws.map(w => w[0]).join(" "); });
const VBYCH = {}; VIDEOS.forEach(v => (VBYCH[v.ch] = VBYCH[v.ch] || []).push(v));
const BADGES = { 1: "Paperwork Pro", 2: "Sign Whisperer", 3: "Smooth Operator", 4: "Intersection Ace", 5: "Merge Master", 6: "Cool Under Pressure", 7: "Good Choices Champ", 8: "Road Sharer", 9: "Law Abider", 10: "Trailer Tamer" };
const LEVELS = [[0, "Learner"], [150, "Road Rookie"], [400, "Lane Legend"], [800, "Road Scholar"], [1300, "Highway Hero"]];

// ---------- persistence ----------
function load() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
let ST = Object.assign({ tests: [], seen: {}, missed: {}, chap: {}, xp: 0, mods: {}, best: {} }, load());
let SB = null, USER = null, pushTimer = null;
function save() { ST.savedAt = Date.now(); try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) {} if (USER) pushUp(); }
const mod = ch => ST.mods[ch] = ST.mods[ch] || {};
function level() {
  let i = 0; LEVELS.forEach((l, k) => { if (ST.xp >= l[0]) i = k; });
  const next = LEVELS[i + 1];
  return { name: LEVELS[i][1], i, floor: LEVELS[i][0], next: next ? next[0] : null, nextName: next ? next[1] : null };
}
function award(n, why) {
  ST.xp += n; save(); paintXP();
  toast(`+${n} XP${why ? " · " + why : ""}`);
}
function paintXP() { const l = level(); $("#xpchip").innerHTML = `${ic("star")}${ST.xp} XP · ${l.name}`; }
function toast(t) {
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = ic("star") + esc(t);
  document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
}
function confetti() {
  const cols = ["#f5b301", "#1d4f91", "#2c64b0", "#1e7b45", "#ffd45c", "#e9f0fa"];
  for (let i = 0; i < 90; i++) {
    const d = document.createElement("div"); d.className = "cf";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = pick(cols);
    d.style.animationDuration = (1.6 + Math.random() * 1.6) + "s"; d.style.animationDelay = Math.random() * .4 + "s";
    document.body.appendChild(d); setTimeout(() => d.remove(), 3800);
  }
}
function modal(html, wide) {
  closeModal();
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="box ${wide ? "wide" : ""}">${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }

// ---------- routing: every screen has an address, so refresh and the back button work ----------
let ROUTING = false;
function setRoute(h, replace) {
  if (ROUTING) return;
  const url = "#" + h;
  if (location.hash === url) return;
  if (replace) history.replaceState(null, "", url); else history.pushState(null, "", url);
}
function route() {
  ROUTING = true;
  try {
    const [v, a] = location.hash.replace(/^#/, "").split("/");
    const n = parseInt(a, 10);

    if (at >= 0) { const end = at + qn.length, idx = []; starts.forEach((s, i) => { if (s < end && s + ws[i].length > at) idx.push(i); }); return { page: p, idx }; }

// ---------- question selection ----------
function pickFrom(pool, n, used) {
  const missed = shuffle(pool.filter(q => ST.missed[q.id] && !used.has(q.id))).slice(0, Math.ceil(n / 4));
  const rest = shuffle(pool.filter(q => !used.has(q.id) && !missed.includes(q))).sort((a, b) => (ST.seen[a.id] || 0) - (ST.seen[b.id] || 0));
  const out = missed.concat(rest).slice(0, n);
  out.forEach(q => used.add(q.id));
  return out;
}
function buildTest() {
  const used = new Set(), out = [];
  out.push(...pickFrom(QS.filter(q => q.type === "sign"), BLUEPRINT.signCount, used));
  Object.entries(BLUEPRINT.chapterQuota).forEach(([ch, n]) => {
    ch = +ch;
    const already = out.filter(q => q.ch === ch).length;
    out.push(...pickFrom((QBYCH[ch] || []).filter(q => q.type !== "sign"), Math.max(0, n - already), used));
  });
  if (out.length < TEST_LEN) out.push(...pickFrom(QS, TEST_LEN - out.length, used));
  return shuffle(out.slice(0, TEST_LEN));
}

// ---------- progress ----------
function historyChart(tests) {
  if (!tests.length) return `<p class="mut">No practice tests yet. Your scores will show up here.</p>`;
  const W = 600, H = 150, pad = 26, n = tests.length, slot = (W - pad) / n, bw = Math.min(34, slot - 6);
  const y = s => H - 18 - (s / 30) * (H - 30);
  const bars = tests.map((t, i) => {
    const x = pad + i * slot + (slot - bw) / 2, top = y(t.score), h = Math.max(5, H - 18 - top);
    const tip = esc(new Date(t.at).toLocaleDateString() + ": " + t.score + "/30 " + (t.score >= PASS ? "(pass)" : "(not yet)"));
    return `<path d="M${x},${H - 18} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z" fill="#1d4f91"/>
      <rect data-tip="${tip}" x="${pad + i * slot}" y="0" width="${slot}" height="${H - 18}" fill="transparent"/>`;
  }).join("");
  const py = y(PASS);
  return `<div class="hist"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Practice test scores over time">
    ${[0, 10, 20, 30].map(v => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f6"/><text x="${pad - 6}" y="${y(v) + 4}" font-size="11" fill="#647185" text-anchor="end">${v}</text>`).join("")}
    ${bars}
    <line x1="${pad}" x2="${W}" y1="${py}" y2="${py}" stroke="#f5b301" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${W}" y="${py - 5}" font-size="11.5" fill="#7a5600" text-anchor="end" font-weight="700">Pass: 25</text>
  </svg><div class="mut" style="font-size:13px;margin-top:6px">Last ${n} practice test${n > 1 ? "s" : ""}, oldest to newest. Hover a bar for details.</div></div>`;
}

}
